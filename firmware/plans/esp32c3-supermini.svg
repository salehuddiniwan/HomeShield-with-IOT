<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ESP32-C3 SuperMini pinout</title>
<desc id="d">ESP32-C3 SuperMini, top view with USB-C at the top. Left pins top to bottom: 5V, GND, 3V3, GPIO 4, 3, 2, 1, 0. Right pins: GPIO 5, 6, 7, 8, 9, 10, 20, 21. GPIO 0, 1, 3, 4 read analog; 5, 6, 7, 10 are digital; 20 and 21 are serial RX/TX; avoid 2, 8 (blue LED) and 9 (BOOT button).</desc>
<rect width="1500" height="860" fill="#ffffff"/>
<text x="40" y="50" font-size="26" fill="#1b2230" font-weight="700" text-anchor="start" >ESP32-C3 SuperMini · pins for HomeShield</text>
<text x="40" y="78" font-size="15" fill="#5a6475" text-anchor="start" >Top view, USB-C at the top. Same firmware as the DevKit (HomeShieldNode 1.3); HomeShield's pin picker knows these pins.</text>
