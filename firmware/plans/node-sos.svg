<text x="736" y="669" font-size="13" fill="#e8edf5" text-anchor="end" >3V3</text>
<text x="230" y="306" font-size="15" fill="#1b2230" font-weight="700" text-anchor="middle" >SOS push button</text>
<rect x="180" y="402" width="100" height="18" rx="3" fill="#2b2f36"/>
<circle cx="230" cy="376" r="38" fill="#b3261e"/><circle cx="230" cy="372" r="30" fill="#e5483f"/>
<text x="230" y="379" font-size="17" fill="#ffffff" font-weight="800" text-anchor="middle" letter-spacing="1">SOS</text>
<line x1="268" y1="376" x2="292" y2="376" stroke="#9aa3b0" stroke-width="4"/>
<line x1="192" y1="376" x2="168" y2="376" stroke="#9aa3b0" stroke-width="4"/>
<text x="230" y="448" font-size="13" fill="#5a6475" text-anchor="middle" >Tactile button: use two legs on</text>
<text x="230" y="466" font-size="13" fill="#5a6475" text-anchor="middle" >opposite sides (diagonal) of it.</text>
<path d="M488 376 L390 376 L292 376" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M488 376 L390 376 L292 376" fill="none" stroke="#7c4dff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="488" cy="376" r="4.5" fill="#7c4dff"/><circle cx="292" cy="376" r="4.5" fill="#7c4dff"/>
<path d="M168 376 L120 376 L120 668 L400 668 L400 628 L488 628" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M168 376 L120 376 L120 668 L400 668 L400 628 L488 628" fill="none" stroke="#222222" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="168" cy="376" r="4.5" fill="#222222"/><circle cx="488" cy="628" r="4.5" fill="#222222"/>
<path d="M620 750 V810" fill="none" stroke="#555b66" stroke-width="7" stroke-linecap="round"/>
<rect x="586" y="810" width="68" height="40" rx="6" fill="#e9edf2" stroke="#9aa3b0"/>
<rect x="606" y="850" width="28" height="12" rx="2" fill="#9aa3b0"/>
<text x="620" y="835" font-size="13" fill="#1b2230" font-weight="700" text-anchor="middle" >5 V</text>
<text x="620" y="882" font-size="12" fill="#5a6475" text-anchor="middle" >USB power: phone charger, power bank or the computer</text>
<text x="800" y="160" font-size="15" fill="#1b2230" font-weight="700" text-anchor="start" >Pins</text>
<text x="800" y="186" font-size="11" fill="#5a6475" font-weight="700" text-anchor="start" letter-spacing="1">GPIO</text>
<text x="870" y="186" font-size="11" fill="#5a6475" font-weight="700" text-anchor="start" letter-spacing="1">WIRED TO</text>
<text x="1060" y="186" font-size="11" fill="#5a6475" font-weight="700" text-anchor="start" letter-spacing="1">MAP IT IN HOMESHIELD AS</text>
<line x1="800" y1="194" x2="1310" y2="194" stroke="#e3e8ef"/>
<text x="800" y="210" font-size="13" fill="#c26a00" font-weight="700" text-anchor="start" >33</text>
<text x="870" y="210" font-size="13" fill="#1b2230" text-anchor="start" >SOS button, other leg to GND</text>
<text x="1060" y="210" font-size="13" fill="#1b2230" text-anchor="start" >SOS button · room Master bedroom</text>
<rect x="800" y="260" width="400" height="200" rx="10" fill="#f6f8fb" stroke="#c9d1dc"/>
<text x="818" y="288" font-size="15" fill="#1b2230" font-weight="700" text-anchor="start" >How it works</text>
<text x="818" y="312" font-size="13" fill="#5a6475" text-anchor="start" >No resistor needed: the ESP32's own pull-up</text>
<text x="818" y="332" font-size="13" fill="#5a6475" text-anchor="start" >keeps GPIO 33 high until the button pulls it</text>
<text x="818" y="352" font-size="13" fill="#5a6475" text-anchor="start" >to GND. HomeShield then opens a critical</text>
<text x="818" y="372" font-size="13" fill="#5a6475" text-anchor="start" >'SOS: help requested' incident, sends WhatsApp,</text>
<text x="818" y="392" font-size="13" fill="#5a6475" text-anchor="start" >and the buzzer on the devices node sounds.</text>
<text x="818" y="412" font-size="13" fill="#5a6475" text-anchor="start" ></text>
<text x="818" y="432" font-size="13" fill="#5a6475" text-anchor="start" >This board has no buzzer, so the person hears</text>
<text x="818" y="452" font-size="13" fill="#5a6475" text-anchor="start" >nothing here: the alarm needs HomeShield running.</text>
<rect x="800" y="470" width="400" height="100" rx="10" fill="#f6f8fb" stroke="#c9d1dc"/>
<text x="818" y="498" font-size="15" fill="#1b2230" font-weight="700" text-anchor="start" >On the board itself</text>
<text x="818" y="522" font-size="13" fill="#5a6475" text-anchor="start" >Blue LED: steady = connected to HomeShield.</text>
<text x="818" y="542" font-size="13" fill="#5a6475" text-anchor="start" >BOOT button: press to silence the alarm;</text>
<text x="818" y="562" font-size="13" fill="#5a6475" text-anchor="start" >hold 5 s to redo the Wi-Fi setup.</text>
</svg>
