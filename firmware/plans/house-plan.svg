<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1190" viewBox="0 0 1660 1190" font-family="Segoe UI, Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">HomeShield IoT test house plan</title>
<desc id="d">Double-storey terrace house. Ground floor: kitchen at the back with the gas stove, sensors node (ESP32 #3), MQ-5 high on the wall, flame sensor facing the stove and PIR watching the back door; dining; living room with the devices node (ESP32 #2) and buzzer at the TV console and the HomeShield PC; car porch at the front. Lights L1 porch, L2 living room, L3 kitchen. First floor: bedroom 2 (L5), bathroom, landing, master bedroom (L4) with the SOS node (ESP32 #1) and its button at the bedside.</desc>
<rect width="1660" height="1190" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#1b2230" font-weight="700" text-anchor="start" >HomeShield IoT test house · double-storey terrace</text>
<text x="40" y="80" font-size="15" fill="#5a6475" text-anchor="start" >Where the three ESP32 boards go, which LED is which room's light, and where each sensor points. All three boards join the same 2.4 GHz Wi-Fi as the HomeShield computer.</text>
