<text x="736" y="633" font-size="13" fill="#e8edf5" text-anchor="end" >GND</text>
<circle cx="488" cy="664" r="7" fill="#d4a640" stroke="#8a6a1f"/>
<text x="504" y="669" font-size="13" fill="#e8edf5" text-anchor="start" >VIN</text>
