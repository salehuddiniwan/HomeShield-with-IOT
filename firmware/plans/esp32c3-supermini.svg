<text x="40" y="640" font-size="15" fill="#1b2230" font-weight="700" text-anchor="start" >Pin colours</text>
<rect x="40" y="657" width="34" height="18" rx="9" fill="#1f6fd1"/>
<text x="86" y="671" font-size="13" fill="#5a6475" text-anchor="start" >Analog + digital: sensors, MQ gas, LEDs, relays</text>
<rect x="40" y="687" width="34" height="18" rx="9" fill="#2e7d32"/>
<text x="86" y="701" font-size="13" fill="#5a6475" text-anchor="start" >Digital: LEDs, relays, buttons, PIR, flame</text>
<rect x="40" y="717" width="34" height="18" rx="9" fill="#b7791f"/>
<text x="86" y="731" font-size="13" fill="#5a6475" text-anchor="start" >Usable; serial RX/TX, may blip at start-up</text>
<rect x="40" y="747" width="34" height="18" rx="9" fill="#8d95a1"/>
<text x="86" y="761" font-size="13" fill="#5a6475" text-anchor="start" >Don't use</text>
<rect x="560" y="657" width="34" height="18" rx="9" fill="#d32f2f"/>
<text x="606" y="671" font-size="13" fill="#5a6475" text-anchor="start" >5 V in/out (USB)</text>
<rect x="560" y="687" width="34" height="18" rx="9" fill="#ef8f00"/>
<text x="606" y="701" font-size="13" fill="#5a6475" text-anchor="start" >3.3 V out</text>
<rect x="560" y="717" width="34" height="18" rx="9" fill="#222222"/>
<text x="606" y="731" font-size="13" fill="#5a6475" text-anchor="start" >Ground</text>
<rect x="1020" y="130" width="440" height="220" rx="10" fill="#f6f8fb" stroke="#c9d1dc"/>
<text x="1038" y="158" font-size="15" fill="#1b2230" font-weight="700" text-anchor="start" >Arduino IDE</text>
<text x="1038" y="182" font-size="13" fill="#5a6475" text-anchor="start" >Board: Nologo ESP32C3 Super Mini</text>
<text x="1038" y="202" font-size="13" fill="#5a6475" text-anchor="start" >(or ESP32C3 Dev Module, with</text>
<text x="1038" y="222" font-size="13" fill="#5a6475" text-anchor="start" >Tools › USB CDC On Boot: Enabled).</text>
<text x="1038" y="242" font-size="13" fill="#5a6475" text-anchor="start" >No CP2102 driver: it has native USB.</text>
<text x="1038" y="262" font-size="13" fill="#5a6475" text-anchor="start" >Port missing? Hold BOOT, tap RST,</text>
<text x="1038" y="282" font-size="13" fill="#5a6475" text-anchor="start" >release BOOT, then Upload.</text>
<text x="1038" y="302" font-size="13" fill="#5a6475" text-anchor="start" >For Wi-Fi updates, also export a binary</text>
<text x="1038" y="322" font-size="13" fill="#5a6475" text-anchor="start" >with this board selected (Sketch › Export</text>
<text x="1038" y="342" font-size="13" fill="#5a6475" text-anchor="start" >Compiled Binary): it differs from the DevKit's.</text>
<rect x="1020" y="360" width="440" height="180" rx="10" fill="#f6f8fb" stroke="#c9d1dc"/>
<text x="1038" y="388" font-size="15" fill="#1b2230" font-weight="700" text-anchor="start" >Good jobs for a SuperMini</text>
<text x="1038" y="412" font-size="13" fill="#5a6475" text-anchor="start" >SOS button: GPIO 3 or 4 to GND.</text>
<text x="1038" y="432" font-size="13" fill="#5a6475" text-anchor="start" >PIR or flame sensor: GPIO 0, 1, 3–7 or 10.</text>
<text x="1038" y="452" font-size="13" fill="#5a6475" text-anchor="start" >One MQ gas sensor: GPIO 0, 1, 3 or 4</text>
<text x="1038" y="472" font-size="13" fill="#5a6475" text-anchor="start" >(through a 10 kΩ + 10 kΩ divider).</text>
<text x="1038" y="492" font-size="13" fill="#5a6475" text-anchor="start" >Up to 8 LEDs or relays: 0, 1, 3–7, 10.</text>
<text x="1038" y="512" font-size="13" fill="#5a6475" text-anchor="start" >Blue LED (GPIO 8): lit = connected.</text>
<text x="1038" y="532" font-size="13" fill="#5a6475" text-anchor="start" >BOOT (GPIO 9): silence / hold 5 s to reset.</text>
<text x="40" y="820" font-size="13" fill="#5a6475" text-anchor="start" >Wi-Fi: the firmware lowers the C3's transmit power to 8.5 dBm, which many SuperMini boards need to connect at all. Check the silkscreen: a few clones order the pins differently.</text>
</svg>
